name: Pooled LOOCV paper checks

on:
  push:
    paths:
      - "experiments/pooled_loocv_smoothness/**"
      - "tests/test_pooled_loocv_smoothness.py"
      - "tests/test_guerrero_ratio_pooled_loocv.py"
      - "tests/test_guerrero_variance_estimation.py"
      - "tests/test_estimated_variance_audit.py"
      - "tests/test_guerrero_robustness.py"
      - ".github/workflows/pooled-loocv-checks.yml"
  pull_request:
    paths:
      - "experiments/pooled_loocv_smoothness/**"
      - "tests/test_pooled_loocv_smoothness.py"
      - "tests/test_guerrero_ratio_pooled_loocv.py"
      - "tests/test_guerrero_variance_estimation.py"
      - "tests/test_estimated_variance_audit.py"
      - "tests/test_guerrero_robustness.py"
      - ".github/workflows/pooled-loocv-checks.yml"
  workflow_dispatch:

jobs:
  loocv-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -e ".[dev,symbolic]"
      - name: Run isolated mathematical and numerical tests
        run: python -m pytest tests/test_pooled_loocv_smoothness.py tests/test_guerrero_ratio_pooled_loocv.py tests/test_guerrero_variance_estimation.py tests/test_estimated_variance_audit.py tests/test_guerrero_robustness.py -q
      - name: Confirm campaign preview without simulations
        run: python -m experiments.pooled_loocv_smoothness.run --preset pilot --dry-run
      - name: Execute tiny smoke and validate exported artifacts
        run: |
          python -m experiments.pooled_loocv_smoothness.run --preset smoke --out-dir /tmp/pooled-loocv-smoke
          test -s /tmp/pooled-loocv-smoke/solver_comparison.csv
          test -s /tmp/pooled-loocv-smoke/manifest.json
          test -s /tmp/pooled-loocv-smoke/example_signal_and_objective.png
      - name: Execute Guerrero ratio smoke comparison
        run: |
          python -m experiments.pooled_loocv_smoothness.guerrero_ratio --preset smoke --out-dir /tmp/guerrero-smoke
          test -s /tmp/guerrero-smoke/guerrero_solver_comparison.csv
          test -s /tmp/guerrero-smoke/manifest.json
          test -s /tmp/guerrero-smoke/summary.json
          test -s /tmp/guerrero-smoke/guerrero_example.png
      - name: Execute feasible variance estimator smoke and verify artifacts
        run: |
          python -m experiments.pooled_loocv_smoothness.run_variance_estimation --preset smoke --out-dir /tmp/estimated-variances-smoke
          test -s /tmp/estimated-variances-smoke/variance_estimator_comparison.csv
          test -s /tmp/estimated-variances-smoke/summary.json
          test -s /tmp/estimated-variances-smoke/true_mse_by_noise_level.png
          test -s /tmp/estimated-variances-smoke/common_noise_scale_invariance.csv
      - name: Preview robustness design without running its pilot
        run: python -m experiments.pooled_loocv_smoothness.run_robustness --preset pilot --dry-run > /tmp/robustness-plan.json
      - name: Verify misspecified-noise robustness smoke
        run: |
          python -m experiments.pooled_loocv_smoothness.run_robustness --preset smoke --out-dir /tmp/guerrero-robustness-smoke
          test -s /tmp/guerrero-robustness-smoke/method_comparison.csv
          test -s /tmp/guerrero-robustness-smoke/manifest.json
          test -s /tmp/guerrero-robustness-smoke/summary.json
          test -s /tmp/guerrero-robustness-smoke/robustness_true_trend_mse_R3.png
      - name: Audit uploaded Guerrero pilot when available
        run: |
          if [ -f results/pooled_loocv_smoothness/guerrero/pilot/guerrero_solver_comparison.csv ]; then
            python -m experiments.pooled_loocv_smoothness.audit_guerrero_pilot --out-dir /tmp/guerrero-pilot-audit
            test -s /tmp/guerrero-pilot-audit/audit_summary.json
            test -s /tmp/guerrero-pilot-audit/scenario_by_R_summary.csv
            test -s /tmp/guerrero-pilot-audit/guerrero_paired_two_loss_contrasts.png
          fi
      - name: Audit committed pilot when available
        run: |
          if [ -f results/pooled_loocv_smoothness/pilot/solver_comparison.csv ]; then
            python -m experiments.pooled_loocv_smoothness.audit_pilot --out /tmp/pooled-loocv-pilot-audit.json > /tmp/pooled-loocv-pilot-audit-stdout.json
            test -s /tmp/pooled-loocv-pilot-audit.json
          fi
