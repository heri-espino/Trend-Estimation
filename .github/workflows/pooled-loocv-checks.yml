name: Pooled LOOCV paper checks

on:
  push:
    paths:
      - "experiments/pooled_loocv_smoothness/**"
      - "tests/test_pooled_loocv_smoothness.py"
      - "tests/test_guerrero_ratio_pooled_loocv.py"
      - "tests/test_guerrero_variance_estimation.py"
      - "tests/test_estimated_variance_audit.py"
      - "tests/test_guerrero_robustness.py"
      - "tests/test_guerrero_robustness_audit.py"
      - "tests/test_guerrero_tail_noise.py"
      - "tests/test_guerrero_tail_pilot_audit.py"
      - "tests/test_empirical_market_noise.py"
      - "tests/test_nonzero_difference_mean_reconstruction.py"
      - ".github/workflows/pooled-loocv-checks.yml"
  pull_request:
    paths:
      - "experiments/pooled_loocv_smoothness/**"
      - "tests/test_pooled_loocv_smoothness.py"
      - "tests/test_guerrero_ratio_pooled_loocv.py"
      - "tests/test_guerrero_variance_estimation.py"
      - "tests/test_estimated_variance_audit.py"
      - "tests/test_guerrero_robustness.py"
      - "tests/test_guerrero_robustness_audit.py"
      - "tests/test_guerrero_tail_noise.py"
      - "tests/test_guerrero_tail_pilot_audit.py"
      - "tests/test_empirical_market_noise.py"
      - ".github/workflows/pooled-loocv-checks.yml"
  workflow_dispatch:

jobs:
  loocv-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -e ".[dev,symbolic]"
      - name: Run isolated mathematical and numerical tests
        run: python -m pytest tests/test_pooled_loocv_smoothness.py tests/test_guerrero_ratio_pooled_loocv.py tests/test_guerrero_variance_estimation.py tests/test_estimated_variance_audit.py tests/test_guerrero_robustness.py tests/test_guerrero_robustness_audit.py tests/test_guerrero_tail_noise.py tests/test_guerrero_tail_pilot_audit.py tests/test_empirical_market_noise.py tests/test_nonzero_difference_mean_reconstruction.py -q
      - name: Confirm campaign preview without simulations
        run: python -m experiments.pooled_loocv_smoothness.run --preset pilot --dry-run
      - name: Execute tiny smoke and validate exported artifacts
        run: |
          python -m experiments.pooled_loocv_smoothness.run --preset smoke --out-dir /tmp/pooled-loocv-smoke
          test -s /tmp/pooled-loocv-smoke/solver_comparison.csv
          test -s /tmp/pooled-loocv-smoke/manifest.json
          test -s /tmp/pooled-loocv-smoke/example_signal_and_objective.png
      - name: Execute Guerrero ratio smoke comparison
        run: |
          python -m experiments.pooled_loocv_smoothness.guerrero_ratio --preset smoke --out-dir /tmp/guerrero-smoke
          test -s /tmp/guerrero-smoke/guerrero_solver_comparison.csv
          test -s /tmp/guerrero-smoke/manifest.json
          test -s /tmp/guerrero-smoke/summary.json
          test -s /tmp/guerrero-smoke/guerrero_example.png
      - name: Execute feasible variance estimator smoke and verify artifacts
        run: |
          python -m experiments.pooled_loocv_smoothness.run_variance_estimation --preset smoke --out-dir /tmp/estimated-variances-smoke
          test -s /tmp/estimated-variances-smoke/variance_estimator_comparison.csv
          test -s /tmp/estimated-variances-smoke/summary.json
          test -s /tmp/estimated-variances-smoke/true_mse_by_noise_level.png
          test -s /tmp/estimated-variances-smoke/common_noise_scale_invariance.csv
      - name: Preview robustness design without running its pilot
        run: python -m experiments.pooled_loocv_smoothness.run_robustness --preset pilot --dry-run > /tmp/robustness-plan.json
      - name: Check tail-stress design without launching its pilot
        run: python -m experiments.pooled_loocv_smoothness.run_tail_noise --preset pilot --dry-run > /tmp/tail-stress-plan.json
      - name: Execute tiny tail-stress smoke only
        run: |
          python -m experiments.pooled_loocv_smoothness.run_tail_noise --preset smoke --out-dir /tmp/tail-stress-smoke > /tmp/tail-smoke-summary.txt
          test -s /tmp/tail-stress-smoke/method_comparison.csv
          test -s /tmp/tail-stress-smoke/manifest.json
          test -s /tmp/tail-stress-smoke/summary.json
      - name: Validate financial empirical-noise design without internet
        run: python -m experiments.pooled_loocv_smoothness.run_empirical_market_noise --preset pilot --dry-run > /tmp/market-return-pilot-plan.json
      - name: Execute offline synthetic-fixture market-noise smoke only
        run: |
          python -m experiments.pooled_loocv_smoothness.run_empirical_market_noise --preset smoke --out-dir /tmp/market-noise-smoke
          test -s /tmp/market-noise-smoke/method_comparison.csv
          test -s /tmp/market-noise-smoke/manifest.json
          test -s /tmp/market-noise-smoke/summary.json
      - name: Validate nonzero difference-mean pilot design (no large run)
        run: python -m experiments.pooled_loocv_smoothness.run_nonzero_difference_mean --preset pilot --dry-run > /tmp/nonzero-mu-plan.json
      - name: Run tiny fold-clean nonzero difference-mean smoke
        run: |
          python -m experiments.pooled_loocv_smoothness.run_nonzero_difference_mean --preset smoke --out-dir /tmp/nonzero-mu-smoke
          test -s /tmp/nonzero-mu-smoke/manifest.json
          test -s /tmp/nonzero-mu-smoke/method_comparison.csv
          test -s /tmp/nonzero-mu-smoke/summary.json
      - name: Verify misspecified-noise robustness smoke
        run: |
          python -m experiments.pooled_loocv_smoothness.run_robustness --preset smoke --out-dir /tmp/guerrero-robustness-smoke
          test -s /tmp/guerrero-robustness-smoke/method_comparison.csv
          test -s /tmp/guerrero-robustness-smoke/manifest.json
          test -s /tmp/guerrero-robustness-smoke/summary.json
          test -s /tmp/guerrero-robustness-smoke/robustness_true_trend_mse_R3.png
      - name: Audit uploaded Guerrero pilot when available
        run: |
          if [ -f results/pooled_loocv_smoothness/guerrero/pilot/guerrero_solver_comparison.csv ]; then
            python -m experiments.pooled_loocv_smoothness.audit_guerrero_pilot --out-dir /tmp/guerrero-pilot-audit
            test -s /tmp/guerrero-pilot-audit/audit_summary.json
            test -s /tmp/guerrero-pilot-audit/scenario_by_R_summary.csv
            test -s /tmp/guerrero-pilot-audit/guerrero_paired_two_loss_contrasts.png
          fi
      - name: Independently audit saved robustness pilot without plotting
        run: |
          if [ -f results/pooled_loocv_smoothness/guerrero/robustness/pilot/method_comparison.csv ]; then
            python -m experiments.pooled_loocv_smoothness.audit_robustness --out-dir /tmp/robustness-pilot-audit > /tmp/robustness-pilot-audit.stdout.json
            test -s /tmp/robustness-pilot-audit/audit_summary.json
            test -s /tmp/robustness-pilot-audit/R3_scenario_summary.csv
            test -s /tmp/robustness-pilot-audit/paired_pool_differences.csv
          fi
      - name: Independently audit uploaded tail-noise pilot (no simulation)
        run: |
          if [ -f results/pooled_loocv_smoothness/guerrero/tail_stress/pilot/method_comparison.csv ]; then
            python -m experiments.pooled_loocv_smoothness.audit_tail_noise --out-dir /tmp/tail-pilot-audit > /tmp/tail-pilot-audit.stdout.json
            test -s /tmp/tail-pilot-audit/audit_summary.json
            test -s /tmp/tail-pilot-audit/R3_by_d_distribution.csv
            test -s /tmp/tail-pilot-audit/R3_by_scenario.csv
          fi
      - name: Audit committed pilot when available
        run: |
          if [ -f results/pooled_loocv_smoothness/pilot/solver_comparison.csv ]; then
            python -m experiments.pooled_loocv_smoothness.audit_pilot --out /tmp/pooled-loocv-pilot-audit.json > /tmp/pooled-loocv-pilot-audit-stdout.json
            test -s /tmp/pooled-loocv-pilot-audit.json
          fi
