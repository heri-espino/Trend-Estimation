name: Wiki integrity

on:
  push:
    paths:
      - "wiki/**"
      - "tools/validate_wiki.py"
      - "tests/test_wiki.py"
      - "literature/pdf/**"
      - "literature/extracted/**"
      - ".github/workflows/wiki-integrity.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "tools/validate_wiki.py"
      - "tests/test_wiki.py"
      - "literature/pdf/**"
      - "literature/extracted/**"
      - ".github/workflows/wiki-integrity.yml"

jobs:
  verify-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate proof graph and Markdown
        run: python tools/validate_wiki.py
      - name: Install lightweight test runner
        run: python -m pip install pytest
      - name: Run wiki-only tests
        run: python -m pytest -q tests/test_wiki.py
