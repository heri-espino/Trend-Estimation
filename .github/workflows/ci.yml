name: CI

on:
  push:
  pull_request:

jobs:
  test-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install editable package
        run: python -m pip install -e ".[dev,docs]"

      - name: Verify public import
        run: python -c "import trend_estimation as td; print(td.__version__)"

      - name: Run tests
        run: python -m pytest

      - name: Validate Sphinx documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
