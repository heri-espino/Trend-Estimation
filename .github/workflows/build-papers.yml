name: Build working papers

on:
  workflow_dispatch:
    inputs:
      target:
        description: Independent working paper to compile
        required: true
        default: smoothness-cv
        type: choice
        options:
          - smoothness-cv
          - numerical
          - branches
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Record short commit SHA
        id: meta
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Install LaTeX toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-xetex

      - name: Build Smoothness Cross Validation
        if: ${{ inputs.target == 'smoothness-cv' || inputs.target == 'all' }}
        shell: bash
        run: |
          python "working_papers/Working Paper - Smoothness Cross Validation/build.py"

      - name: Build Numerical Methods
        if: ${{ inputs.target == 'numerical' || inputs.target == 'all' }}
        shell: bash
        run: |
          cd "working_papers/Working Paper - Numerical Methods"
          mkdir -p build
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build main.tex

      - name: Build Dynamic Branch Selection
        if: ${{ inputs.target == 'branches' || inputs.target == 'all' }}
        shell: bash
        run: |
          python "working_papers/Working Paper - Dynamic Branch Selection/build.py"

      - name: Upload Smoothness Cross Validation PDF
        if: ${{ inputs.target == 'smoothness-cv' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoothness-cv-${{ steps.meta.outputs.short_sha }}
          path: working_papers/Working Paper - Smoothness Cross Validation/EspinoMontelongo-2026-Forecast_Optimal_Smoothness.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload Numerical Methods PDF
        if: ${{ inputs.target == 'numerical' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: numerical-methods-${{ steps.meta.outputs.short_sha }}
          path: working_papers/Working Paper - Numerical Methods/build/main.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Upload Dynamic Branch Selection PDF
        if: ${{ inputs.target == 'branches' || inputs.target == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-branch-selection-${{ steps.meta.outputs.short_sha }}
          path: working_papers/Working Paper - Dynamic Branch Selection/build/main.pdf
          if-no-files-found: error
          retention-days: 30
