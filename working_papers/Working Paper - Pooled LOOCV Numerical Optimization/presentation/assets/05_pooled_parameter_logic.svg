<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect x="0" y="0" width="1200" height="675" rx="0" fill="#fff"/><rect x="0" y="0" width="12" height="675" rx="0" fill="#1f888c"/><text x="53" y="58" font-family="Arial, sans-serif" fill="#142c4a" font-size="34">Pooling: compare reconstruction of the SAME first series</text><text x="53" y="95" font-family="Arial, sans-serif" fill="#61768b" font-size="18">A common λ can change the fitted first trend even though y¹ never changes</text><text x="80" y="150" font-family="Arial, sans-serif" fill="#142c4a" font-size="31">First series is identical in both fits</text><text x="145" y="225" font-family="Arial, sans-serif" fill="#2a63a1" font-size="30">R = 1</text><text x="775" y="225" font-family="Arial, sans-serif" fill="#1f888c" font-size="30">R = 3</text><rect x="69" y="265" width="470" height="103" rx="17" fill="#e9f5f6"/><text x="95" y="329" font-family="Arial, sans-serif" fill="#2a63a1" font-size="32">y¹ → λ̂¹ → τ̂¹</text><rect x="649" y="265" width="483" height="88" rx="14" fill="#e0f4f0"/><text x="685" y="319" font-family="Arial, sans-serif" fill="#142c4a" font-size="27">y1 → shared λ̂ → τ̂1</text><rect x="649" y="369" width="483" height="88" rx="14" fill="#e9f5f6"/><text x="685" y="423" font-family="Arial, sans-serif" fill="#142c4a" font-size="27">y2 → shared λ̂ → τ̂2</text><rect x="649" y="473" width="483" height="88" rx="14" fill="#e9f5f6"/><text x="685" y="527" font-family="Arial, sans-serif" fill="#142c4a" font-size="27">y3 → shared λ̂ → τ̂3</text><text x="82" y="572" font-family="Arial, sans-serif" fill="#bf5360" font-size="24">Only the additional series—and hence fitted common λ—change.</text><line x1="53" y1="633" x2="1147" y2="633" stroke="#dde6eb" stroke-width="2"/><text x="55" y="657" font-family="Arial, sans-serif" fill="#61768b" font-size="14">Teaching diagram · conceptual unless a source table is named</text></svg>
