<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect x="0" y="0" width="1200" height="675" rx="0" fill="#fff"/><rect x="0" y="0" width="12" height="675" rx="0" fill="#1f888c"/><text x="53" y="58" font-family="Arial, sans-serif" fill="#142c4a" font-size="34">Same random shocks, nine mechanisms, eleven policies</text><text x="53" y="95" font-family="Arial, sans-serif" fill="#61768b" font-size="18">One seed is the statistical unit; everything within it is paired</text><text x="71" y="156" font-family="Arial, sans-serif" fill="#2a63a1" font-size="26">One independent seed j</text><rect x="66" y="175" width="315" height="99" rx="8" fill="#e9f5f6"/><text x="94" y="235" font-family="Arial, sans-serif" fill="#142c4a" font-size="32">εʲ, ηʲ, zʲ</text><line x1="391" y1="224" x2="528" y2="224" stroke="#2a63a1" stroke-width="5"/><text x="544" y="233" font-family="Arial, sans-serif" fill="#142c4a" font-size="30">9 modified processes</text><rect x="62" y="338" width="104" height="73" rx="12" fill="#e1eef9"/><text x="102" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">1</text><rect x="185" y="338" width="104" height="73" rx="12" fill="#e1f3ee"/><text x="225" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">2</text><rect x="308" y="338" width="104" height="73" rx="12" fill="#fbeaea"/><text x="348" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">3</text><rect x="431" y="338" width="104" height="73" rx="12" fill="#e1eef9"/><text x="471" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">4</text><rect x="554" y="338" width="104" height="73" rx="12" fill="#e1f3ee"/><text x="594" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">5</text><rect x="677" y="338" width="104" height="73" rx="12" fill="#fbeaea"/><text x="717" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">6</text><rect x="800" y="338" width="104" height="73" rx="12" fill="#e1eef9"/><text x="840" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">7</text><rect x="923" y="338" width="104" height="73" rx="12" fill="#e1f3ee"/><text x="963" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">8</text><rect x="1046" y="338" width="104" height="73" rx="12" fill="#fbeaea"/><text x="1086" y="388" font-family="Arial, sans-serif" fill="#142c4a" font-size="28">9</text><text x="74" y="480" font-family="Arial, sans-serif" fill="#142c4a" font-size="27">Each process → R=1, R=3 → 11 feasible policies</text><text x="74" y="565" font-family="Arial, sans-serif" fill="#bf5360" font-size="26">1,000 independent seeds ≠ 198,000 independent observations</text><line x1="53" y1="633" x2="1147" y2="633" stroke="#dde6eb" stroke-width="2"/><text x="55" y="657" font-family="Arial, sans-serif" fill="#61768b" font-size="14">Teaching diagram · conceptual unless a source table is named</text></svg>
