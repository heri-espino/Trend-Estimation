[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trend-estimation"
version = "0.3.0a0"
description = "Research library for penalized trend estimation, forecasting, chronological validation, and numerical smoothness selection."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Heriberto Espino Montelongo"}]
keywords = [
  "time-series",
  "trend-estimation",
  "smoothing",
  "forecasting",
  "penalized-least-squares",
  "optimization",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]
docs = ["sphinx>=8", "furo>=2024.8.6"]
finance = ["yfinance>=0.2"]

[project.urls]
Repository = "https://github.com/heri-espino/Trend-Estimation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
